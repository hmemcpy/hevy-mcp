name: Deploy
on:
  workflow_dispatch:
    inputs:
      deploy_without_standard_catalog:
        description: "Deploy without standard exercise search (replaces any previously bundled catalog)"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: hevy-mcp-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Confirm catalog-free deployment
        if: ${{ !inputs.deploy_without_standard_catalog }}
        run: |
          echo "This workflow has no private catalog. Acknowledge catalog-free deployment or deploy locally."
          exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
