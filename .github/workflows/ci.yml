name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run package:source
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: hevy-mcp-source-${{ github.sha }}
          path: |
            dist/hevy-mcp-*.zip
            dist/hevy-mcp-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
